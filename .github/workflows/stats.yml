name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Generate stats
        uses: cicirello/user-statistician@v1.25.0
        with:
          user: Miguel-Haro
          repositories: true
          commits: true
          issues: true
          pull_requests: true
          languages: true
          output_branch: stats-output
