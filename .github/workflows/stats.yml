name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Generate stats
        uses: cicirello/user-statistician@v1.25.0
        with:
          image-file: stats.svg
          locale: pt-br
          commit-and-push: true
        env:
          GH_TOKEN: ${{ github.token }}
